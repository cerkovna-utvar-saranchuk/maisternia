<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Майстерня">
<meta name="theme-color" content="#12130e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Майстерня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto+Condensed:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ПДА-термінал для телефона: брудний оливковий фон, бурштиновий акцент, кутасті панелі з фасками, нижня панель вкладок, дані моноширинним шрифтом. Одна темна тема за задумом. */
:root{
  --bg:#12130e; --surface:#1b1d15; --ink:#dcd8c4; --mute:#8f8c77; --line:#3a3c2c;
  --accent:#e0932d; --on-accent:#14110a; --gold:#e0932d;
  --ok:#93b34a; --warn:#e8b13a; --bad:#d4553b; --on-bad:#14110a;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Roboto Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--body); -webkit-text-size-adjust:100%;
  padding-block:8px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:560px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4) 100%)}

h1{font:600 34px/1.05 var(--display);margin:0;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
h2{font:500 18px/1.2 var(--display);margin:0;letter-spacing:.1em;text-transform:uppercase}
.top{padding:14px 0 16px}
.tt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.orn{display:block;width:96px;max-width:100%;height:6px;margin:12px 0 10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--bg) 6px 12px)}
.sub{margin:0;color:var(--mute);font:400 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.brand{background:#0b0b08;border:1px solid var(--line);border-radius:2px;margin:10px 0 14px;padding:14px 12px 12px;text-align:center;overflow:hidden}
.bs{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,#0b0b08 6px 12px)}
.wm{margin:14px 0 4px;font:600 clamp(26px,9.4vw,58px)/1 var(--display);letter-spacing:.05em;color:var(--ink);white-space:nowrap;text-shadow:0 0 14px rgba(224,147,45,.28),2px 2px 0 rgba(0,0,0,.6)}
.wm i{font-style:normal;color:var(--accent)}
.wsub{margin:0 0 14px;font:400 11px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mu{color:var(--mute)} .sm{font-size:13px}

/* кнопки */
.btn{border:0;border-radius:2px;padding:11px 16px;min-height:44px;background:var(--accent);color:var(--on-accent);font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mute)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:12px 0 4px;min-height:44px;cursor:pointer}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:6px 0 0;cursor:pointer}
.lnk.bad{color:var(--bad);font-size:14px;padding:14px 0}
.ico{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--mute);border-radius:8px;font-size:22px;line-height:1;padding:0;cursor:pointer}
.ico:active{background:var(--line)}
.addb{display:block;width:100%;margin-top:8px;padding:12px;border:1px dashed var(--mute);border-radius:2px;background:transparent;color:var(--accent);font:500 14px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

/* поля */
input,textarea,select{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px}
textarea{resize:vertical;min-height:64px}
.o-name{font:600 26px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 0;margin:8px 0 14px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ef .full{grid-column:1/-1}

/* картки замовлень */
.ocard{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-name{font:500 20px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mu{color:var(--mute)}
.wire{--p:0;position:relative;height:14px;margin:12px 0 8px}
.wire::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line)}
.wire i{position:absolute;left:0;top:6px;height:2px;width:calc(var(--p) * 1%);background:var(--gold)}
.wire b{position:absolute;top:2px;width:10px;height:10px;border-radius:0;transform:rotate(45deg);background:var(--gold);left:calc(var(--p) * 1% - var(--p) * .1px)}
@media (prefers-reduced-motion:no-preference){.wire i,.wire b{transition:width .3s,left .3s}}
.emptyst{padding:28px 0;color:var(--mute)}

/* таблиці */
.sec{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.hint{font-size:12px;color:var(--mute)}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:10px 10px 6px;white-space:nowrap}
th.r,td.q{text-align:right}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
td.ck{width:42px;padding-right:0}
td.ck input{width:22px;height:22px;margin:0;padding:0;accent-color:var(--accent)}
td.q{white-space:nowrap;font:400 14px var(--mono);font-variant-numeric:tabular-nums}
td.x{white-space:nowrap;text-align:right;padding-left:0;padding-right:6px}
.nm{font:500 17px/1.2 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
tr.done .nm{text-decoration:line-through;color:var(--mute)}
tr.done .q{color:var(--mute)}
.empty{color:var(--mute);font-size:14px}

/* ресурси */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{position:relative;display:grid;gap:6px;align-content:start;text-align:left;min-width:0;min-height:98px;padding:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:2px;font:inherit;cursor:pointer}
.rt.wide{grid-column:1/-1}
.rt.low{border-top-color:var(--bad)}
.rt.low .rv{color:var(--bad)}
.rl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.rv{font:600 34px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rv small{font:400 13px var(--mono);color:var(--mute);margin-left:6px;letter-spacing:.04em}
.rp{justify-self:start}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:2px}
.seg i{height:9px;background:var(--line)}
.seg i.on{background:var(--accent)}
.rt.low .seg i.on{background:var(--bad)}
.rt.ed{grid-column:1/-1;display:block;cursor:default}
.adj{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* хмара, фото, лайтбокс */
.sync{margin-top:18px;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sync{cursor:pointer}
[hidden]{display:none!important}
.lg{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.lg[hidden]{display:none}
.lgi{max-width:420px;margin:6vh auto 0;display:grid;gap:12px}
.lgi label{display:grid;gap:4px;font:400 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lgm{min-height:20px;font:400 13px var(--mono);color:var(--bad)}
.cl2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.cl2 .fld{margin-bottom:12px}
.links:empty{display:none}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 14px}
a.lk{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.bal{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-2px 0 12px;font:400 13px var(--mono);color:var(--mute)}
.bal b{font:600 22px var(--display);letter-spacing:.04em;color:var(--ink)}
.bal b.due{color:var(--warn)}
.prev{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ccl{font:400 12px var(--mono);letter-spacing:.04em;color:var(--mute);margin:2px 0 0}
.sync.ok{color:var(--ok)} .sync.err{color:var(--warn)}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.ph{padding:0;border:1px solid var(--line);border-radius:2px;background:var(--surface);aspect-ratio:1;overflow:hidden;cursor:pointer}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
label.addb{text-align:center}
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,8,5,.95);display:grid;grid-template-rows:1fr auto;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100vh - 130px);min-height:0;margin:auto;object-fit:contain}
.lbbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ідеї: пінборд */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.add{color:var(--accent);border-style:dashed}
.rubed{display:grid;gap:8px;margin:0 0 12px}
.rubed .row{display:flex;gap:8px;flex-wrap:wrap}
.mas{column-count:2;column-gap:8px}
.pin{display:block;width:100%;break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 8px;padding:0;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:2px;overflow:hidden;cursor:pointer;font:inherit}
.pin.tx{border-left:3px solid var(--mute)}
.pin img{display:block;width:100%;height:auto}
.pb{display:grid;gap:4px;padding:10px}
.pt{font:500 15px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.pd{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.pr{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero{display:block;width:100%;padding:0;margin-bottom:8px;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden;cursor:pointer}
.hero img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover}

.danger{margin-top:20px;padding:14px;border:1px solid var(--bad);border-radius:2px;display:grid;gap:10px}
.danger .row,.bk .row{display:flex;gap:8px;flex-wrap:wrap}
.bk{margin-top:26px;display:grid;gap:10px}
.bk .lnk{justify-self:start;padding:6px 0}

/* статуси, терміни, майстри */
.pill.ac{color:var(--accent)}
.thumb{flex:none;width:56px;height:56px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--bg);display:grid;place-items:center;color:var(--mute)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.ocard .oc-top{align-items:center}
.ocard .oc-name{flex:1}
.ocard .pg{flex-direction:column;align-items:flex-end}
.pg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.nm .pill{margin-left:6px;vertical-align:middle}
.ocard.fin{opacity:.72;border-left-color:var(--mute)}
.ocard.fin.ready{border-left-color:var(--ok)}
.alert{margin:10px 0 14px;padding:10px 12px 4px;border:1px solid var(--bad);border-left:3px solid var(--bad);border-radius:2px;background:rgba(212,85,59,.12);display:grid;gap:2px}
.al-h{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.al-t{font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.al-r{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 0;border:0;border-top:1px solid rgba(212,85,59,.35);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.al-n{font:500 17px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.badge.bad{background:var(--bad);color:var(--on-bad)}

.mcard{display:grid;gap:8px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--mute);border-radius:2px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.mcard.set{border-left-color:var(--ok)}
.mtask{font-size:14px;overflow-wrap:anywhere}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mm{display:grid;gap:2px;align-content:start;min-width:0}
.mq{font:600 28px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mq small{font:400 12px var(--mono);color:var(--mute);margin-left:5px;letter-spacing:.04em}
.mnote{font:400 11px var(--mono);color:var(--mute);letter-spacing:.04em}
.mt2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mtile{display:grid;gap:6px;align-content:start;min-width:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:2px}
.mrow{display:flex;justify-content:space-between;gap:8px;font:400 12px var(--mono);color:var(--mute)}
.mrow b{font-weight:500;color:var(--ink)}
.lv{font-weight:500}
.lv.bad{color:var(--bad)} .lv.warn{color:var(--warn)} .lv.ok{color:var(--ok)}

/* нижня панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;position:relative;display:grid;justify-items:center;gap:2px;min-height:48px;padding:6px 0;border:0;background:none;color:var(--mute);font:500 10px var(--mono);letter-spacing:.02em;text-transform:uppercase;cursor:pointer}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:2px;background:var(--warn);color:var(--bg);font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px;border-radius:2px;background:var(--ink);color:var(--bg);font-size:14px}
.toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;padding:8px;cursor:pointer}
</style>
</head>
<body>

<main id="app"></main>
<nav class="nav" id="nav" aria-label="Розділи"></nav>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" data-act="undo">Повернути</button></div>
<div class="lb" id="lb" hidden data-act="lb-close"></div>
<div class="lg" id="lg" hidden><div class="lgi"><div class="brand" role="img" aria-label="Саранчук, ювелірна майстерня"><div class="bs" aria-hidden="true"></div><div class="wm" aria-hidden="true">S<i>.</i>A<i>.</i>R<i>.</i>A<i>.</i>N<i>.</i>C<i>.</i>H<i>.</i>U<i>.</i>K<i>.</i></div><div class="wsub" aria-hidden="true">ювелірна майстерня</div><div class="bs" aria-hidden="true"></div></div>
<label>Пошта<input id="lg-mail" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" inputmode="email"></label>
<label>Пароль<input id="lg-pass" type="password" autocomplete="current-password"></label>
<button class="btn" data-act="login">Увійти</button><div class="lgm" id="lg-msg" role="alert"></div></div></div>
<datalist id="units"><option value="г"><option value="кг"><option value="мм"><option value="см"><option value="шт"><option value="мл"><option value="пара"></datalist>

<script>
var KEY="zamovlennia-v1";
var S, cur=null, tab="o", edit=null, resEdit=null, ideaOpen=null, ideaRub="", ideaConfirm=false, rubEdit=false, adding=null, confirmDel=false, bkOpen=false, restoreArmed=false, undo=null, toastTimer=null, mOpen=null, mConfirm=false, mvMetal="silver", mvType="issue";

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.orders))return o}}catch(e){}return null}
var cloud={uid:null,busy:false,again:false,st:"pending",timer:null,late:null,code:null}, assetsCap=null, lbId=null, lbArmed=false;
var PH={},PHQ={},BLANK="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function saveQuiet(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updated=Date.now();saveQuiet();queueSync()}
function defStock(){return [{id:uid(),name:"Припій",qty:"",unit:"",need:true},{id:uid(),name:"Флюс",qty:"",unit:"",need:true}]}
function seed(){return {orders:[{id:"ex",name:"Філігранний хрест",due:"",notes:"",items:[
  {id:uid(),kind:"mat",name:"Срібло",qty:"",unit:"г",note:"",done:false},
  {id:uid(),kind:"mat",name:"Каміння",qty:"",unit:"шт",note:"",done:false},
  {id:uid(),kind:"mat",name:"Ебенове дерево (вставка)",qty:"",unit:"шт",note:"замовити заздалегідь",done:false},

function shrink(file,m,q){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,m/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("toBlob"))},"image/jpeg",q)};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"))};
  im.src=u})}
function fitPhoto(file){
  var tries=[[1280,.8],[1000,.72],[800,.65],[640,.6]],i=0;
  return (function go(){return shrink(file,tries[i][0],tries[i][1]).then(function(b){if(b.size>650000&&i<tries.length-1){i++;return go()}return b})})()}
function blobUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(b)})}

function syncText(){return {pending:"● хмара: підключення…",off:"● дані лише на цьому телефоні",ok:"● збережено в хмарі",saving:"● зберігаю в хмарі…",net:"● немає зв’язку, збережу в хмарі пізніше",err:"● хмара недоступна"+errHint()+", дані лише на телефоні. Торкніться, щоб повторити"}[cloud.st]||""}
function errHint(){var c=cloud.code;if(!c)return"";var m={"permission-denied":"немає права запису, перевірте правила бази","unauthenticated":"потрібно увійти знову","resource-exhausted":"перевищено ліміт Firebase","unavailable":"немає зв’язку","failed-precondition":"база не готова","invalid-argument":"запис завеликий"}[c];return " ("+(m||c)+")"}
function setSync(st){cloud.st=st;if(st==="ok")cloud.code=null;var el=document.getElementById("sync");if(el){el.className="sync "+st;el.textContent=syncText()}}
function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function queueSync(){if(!cloud.uid)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushNow,900)}
function pushNow(){
  if(!cloud.uid)return;
  if(cloud.busy){cloud.again=true;return}
  cloud.busy=true;setSync("saving");
  var snap=JSON.parse(JSON.stringify(S));
  FB.saveState(cloud.uid,{u:S.updated||0,s:snap}).then(function(){cloud.busy=false;setSync("ok");if(cloud.again){cloud.again=false;pushNow()}},function(e){cloud.busy=false;cloud.again=false;cloud.code=e&&e.code;setSync("err")})}
function normS(){
  if(!Array.isArray(S.orders))S.orders=[];if(!Array.isArray(S.stock))S.stock=[];if(!Array.isArray(S.res))S.res=defRes();if(!Array.isArray(S.ideas))S.ideas=[];if(!Array.isArray(S.rubrics))S.rubrics=[];normMasters()}
function applyRemote(s,u){
  S=s;normS();S.updated=u;saveQuiet();
  if(cur&&!ord())cur=null;edit=null;adding=null;resEdit=null;confirmDel=false;render()}
function onRemote(r){
  if(r.pending)return;
  if(!r.exists){if(r.fromCache){setSync("net");return}if(!S.updated){S.updated=Date.now();saveQuiet()}pushNow();return}
  var d=r.data||{},u=+d.u||0;
  if(!(d.s&&Array.isArray(d.s.orders))){pushNow();return}
  if(u>(S.updated||0)){
    if(typing()){cloud.late={s:d.s,u:u};return}
    applyRemote(d.s,u);setSync(r.fromCache?"net":"ok")}
  else if((S.updated||0)>u)pushNow();
  else setSync(r.fromCache?"net":"ok")}
setInterval(function(){if(cloud.late&&!typing()){var l=cloud.late;cloud.late=null;if(l.u>(S.updated||0))applyRemote(l.s,l.u)}},2000);

/* одноразовий імпорт зі старої версії (зашифрований файл migration.enc) */
var IMPORT_ON=false;
function impRun(){
  var p=((document.getElementById("imp-pass")||{}).value||"").trim(),msg=document.getElementById("imp-msg");
  function say(t){if(msg)msg.textContent=t}
  if(!cloud.uid){say("Спочатку увійдіть в акаунт.");return}
  if(!p){say("Введіть пароль імпорту.");return}
  say("Завантажую файл…");
  fetch("migration.enc",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("nofile");return r.arrayBuffer()}).then(function(buf){
    var b=new Uint8Array(buf),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
    say("Розшифровую…");
    return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"])
      .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})
      .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct)})
      .catch(function(){throw new Error("badpass")})
  }).then(function(pt){
    var o=JSON.parse(new TextDecoder().decode(pt)),ids=Object.keys(o.photos||{}),i=0;
    (function next(){
      if(i>=ids.length){
        S=o.s;normS();S.updated=Date.now();saveQuiet();pushNow();cur=null;bkOpen=false;render();toast("Імпорт завершено: замовлень "+S.orders.length+", фото "+ids.length,false);return}
      say("Фото "+(i+1)+" з "+ids.length+"…");
      var id=ids[i];
      FB.putPhoto(cloud.uid,id,o.photos[id]).then(function(){PH[id]=o.photos[id];i++;next()},function(){say("Не вдалося записати фото. Перевірте інтернет і повторіть.")})
    })()
  }).catch(function(e){say(e&&e.message==="badpass"?"Невірний пароль імпорту.":"Не вдалося імпортувати. Перевірте інтернет і повторіть.")})}

var ICON_M='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
var METALS=[{k:"silver",n:"Срібло"},{k:"gold",n:"Золото"}];
function r2(x){return Math.round(x*100)/100}
function metalName(k){for(var i=0;i<METALS.length;i++)if(METALS[i].k===k)return METALS[i].n;return k}
function normMasters(){
  if(!Array.isArray(S.masters))S.masters=[];
  S.masters.forEach(function(m){
    if(!Array.isArray(m.moves)){
      m.moves=[];var v=num(m.silver);
      if(v!==null&&v>0)m.moves.push({id:uid(),d:m.d||today(),metal:"silver",type:"issue",amt:v,note:""})
    }
  })}
function mStats(m,metal){
  var iss=0,ret=0;
  (m.moves||[]).forEach(function(e){if(e.metal!==metal)return;if(e.type==="issue")iss+=e.amt;else ret+=e.amt});
  iss=r2(iss);ret=r2(ret);
  var hand=r2(iss-ret);
  return {iss:iss,ret:ret,hand:hand,loss:hand,pct:iss>0?r2(hand/iss*100):null}}
function handTotals(){
  var t={silver:0,gold:0};
  S.masters.forEach(function(m){if(m.settled)return;METALS.forEach(function(x){t[x.k]+=mStats(m,x.k).hand})});
  t.silver=r2(t.silver);t.gold=r2(t.gold);return t}
function lossCell(s){
  if(!s.iss)return '<td class="q">—</td>';
  if(s.loss>0)return '<td class="q"><span class="lv bad">'+s.loss+' г</span><div class="nt">'+s.pct+'%</div></td>';
  if(s.loss<0)return '<td class="q"><span class="lv warn">+'+(-s.loss)+' г</span><div class="nt">надлишок</div></td>';
  return '<td class="q"><span class="lv ok">0 г</span><div class="nt">0%</div></td>'}

function masterCard(m){
  var blocks=METALS.map(function(x){
    var s=mStats(m,x.k);if(!s.iss&&!s.ret)return"";
    var big=m.settled?(s.loss>0?s.loss:(s.loss<0?"+"+(-s.loss):0)):s.hand;
    var lbl=m.settled?(s.loss>=0?"г втрата":"г надлишок"):"г на руках";
    var note=m.settled?(s.pct!==null?s.pct+"% від виданого":""):"видано "+s.iss+" · повернуто "+s.ret;
    return '<div class="mm"><span class="rl">'+x.n+'</span><span class="mq">'+big+'<small>'+lbl+'</small></span><span class="mnote">'+note+'</span></div>'}).join("");
  return '<button class="mcard'+(m.settled?" set":"")+'" data-act="m-open" data-id="'+m.id+'"><div class="oc-top"><span class="oc-name">'+esc(m.name||"Без імені")+'</span>'+(m.settled?'<span class="pill ok">розраховано</span>':"")+'</div>'
   +(m.task?'<div class="mtask">'+esc(m.task)+'</div>':"")
   +(blocks?'<div class="mgrid">'+blocks+'</div>':'<div class="mtask mu">Металу ще не видавали</div>')+'</button>'}
function mastersHtml(){
  var n=S.masters.length,t=handTotals();
  var sub=n?n+" "+plural(n,"майстер","майстри","майстрів")+" · на руках: срібло "+t.silver+" г · золото "+t.gold+" г":"поки без майстрів";
  var body=n?S.masters.map(masterCard).join(""):'<div class="emptyst">Майстрів ще немає. Додайте першого кнопкою вгорі, а далі записуйте, скільки золота й срібла ви йому видали і скільки він повернув.</div>';
  return head("Майстри",sub,'<button class="btn" data-act="m-add">+ Майстер</button>')+body}

function resultHtml(m){
  var rows="";
  METALS.forEach(function(x){var s=mStats(m,x.k);if(!s.iss&&!s.ret)return;rows+='<tr><td><div class="nm">'+x.n+'</div></td><td class="q">'+s.iss+'</td><td class="q">'+s.ret+'</td>'+lossCell(s)+'</tr>'});

function moveForm(){
  return '<section class="sec"><div class="sh"><h2>Записати рух</h2><span class="hint">у грамах</span></div><div class="ef">'
   +'<select id="mv-metal">'+METALS.map(function(x){return '<option value="'+x.k+'"'+(mvMetal===x.k?" selected":"")+'>'+x.n+'</option>'}).join("")+'</select>'
   +'<select id="mv-type"><option value="issue"'+(mvType==="issue"?" selected":"")+'>Видано майстру</option><option value="return"'+(mvType==="return"?" selected":"")+'>Повернуто майстром</option></select>'

    rows+='<tr><td class="mu sm" style="white-space:nowrap">'+fmtD(e.d)+'</td><td><div class="nm">'+esc(metalName(e.metal))+'<span class="pill '+(e.type==="issue"?"warn":"ok")+'">'+(e.type==="issue"?"видано":"повернуто")+'</span></div>'+(e.note?'<div class="nt">'+esc(e.note)+'</div>':"")+'</td><td class="q">'+esc(e.amt)+' г</td><td class="x">'+(m.settled?"":'<button class="ico" data-act="mv-del" data-id="'+e.id+'" aria-label="Видалити запис">×</button>')+'</td></tr>'});

  var m=findIn(S.masters,mOpen);if(!m){mOpen=null;return mastersHtml()}

function act(a,d){
  switch(a){
    case "tab":tab=d.tab;cur=null;edit=null;resEdit=null;closeMaster();closeIdea();rubEdit=false;adding=null;confirmDel=false;render();scrollTo(0,0);break;

    case "edit":edit={k:d.k,id:d.id};adding=null;render();foc("e-name");break;
    case "save-edit":saveEdit();break;
    case "cancel":edit=null;adding=null;render();break;
    case "add":adding=d.kind;edit=null;render();foc("a-name");break;
    case "add-save":addSave(d.kind);break;

    case "bk-toggle":bkOpen=!bkOpen;restoreArmed=false;render();break;
    case "bk-copy":bkCopy();break;
    case "bk-restore":bkRestore();break;
    case "res-edit":resEdit=d.id;edit=null;adding=null;render();foc("r-val");break;

    case "res-del":var rid=resEdit;resEdit=null;del("res",rid);break;
    case "res-new":var nr={id:uid(),name:"Новий ресурс",unit:"",val:"",min:""};S.res.push(nr);resEdit=nr.id;edit=null;adding=null;save();render();foc("r-name");break;
    case "res-go":tab="s";cur=null;resEdit=d.id;edit=null;adding=null;render();scrollTo(0,0);foc("r-val");break;
    case "idea-new":ideaNew();break;

    case "rub-edit":rubEdit=true;render();foc("rb-name");break;
    case "rub-save":var r0=findIn(S.rubrics,ideaRub);if(r0)r0.name=val("rb-name").trim()||r0.name;rubEdit=false;save();render();break;
    case "rub-del":var rid0=ideaRub;S.rubrics=S.rubrics.filter(function(r){return r.id!==rid0});S.ideas.forEach(function(x){if(x.rid===rid0)x.rid=""});ideaRub="";rubEdit=false;save();render();toast("Рубрику видалено, ідеї лишилися в загальній папці",false);break;
    case "idea-plan":ideaPlan(d.id);break;
    case "to-order":var tp=ord();if(tp){tp.plan=false;tp.status="sketch";tab="o";save();render();toast("Проєкт перенесено в замовлення",false)}break;
    case "log-add":logAdd();break;
    case "log-del":logDel(d.id);break;
    case "lb-open":lbId=d.id;lbArmed=false;lbShow();break;
    case "lb-close":lbId=null;lbArmed=false;lbShow();break;
    case "lb-cover":var lo=lbOwner();if(lo&&lo.photos){var li=lo.photos.indexOf(lbId);if(li>0){lo.photos.splice(li,1);lo.photos.unshift(lbId);lbArmed=false;save();render();lbShow();toast("Обкладинку змінено",false)}}break;
    case "lb-del":
