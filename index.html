<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Майстерня">
<meta name="theme-color" content="#12130e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Майстерня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto+Condensed:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ПДА-термінал для телефона: брудний оливковий фон, бурштиновий акцент, кутасті панелі з фасками, нижня панель вкладок, дані моноширинним шрифтом. Одна темна тема за задумом. */
:root{
  --bg:#12130e; --surface:#1b1d15; --ink:#dcd8c4; --mute:#8f8c77; --line:#3a3c2c;
  --accent:#e0932d; --on-accent:#14110a; --gold:#e0932d;
  --ok:#93b34a; --warn:#e8b13a; --bad:#d4553b; --on-bad:#14110a;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Roboto Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--body); -webkit-text-size-adjust:100%;
  padding-block:8px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{max-width:560px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4) 100%)}

h1{font:600 34px/1.05 var(--display);margin:0;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
h2{font:500 18px/1.2 var(--display);margin:0;letter-spacing:.1em;text-transform:uppercase}
.top{padding:14px 0 16px}
.tt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.orn{display:block;width:96px;max-width:100%;height:6px;margin:12px 0 10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--bg) 6px 12px)}
.sub{margin:0;color:var(--mute);font:400 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.brand{background:#0b0b08;border:1px solid var(--line);border-radius:2px;margin:10px 0 14px;padding:14px 12px 12px;text-align:center;overflow:hidden}
.bs{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,#0b0b08 6px 12px)}
.wm{margin:14px 0 4px;font:600 clamp(26px,9.4vw,58px)/1 var(--display);letter-spacing:.05em;color:var(--ink);white-space:nowrap;text-shadow:0 0 14px rgba(224,147,45,.28),2px 2px 0 rgba(0,0,0,.6)}
.wm i{font-style:normal;color:var(--accent)}
.wsub{margin:0 0 14px;font:400 11px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mu{color:var(--mute)} .sm{font-size:13px}

/* кнопки */
.btn{border:0;border-radius:2px;padding:11px 16px;min-height:44px;background:var(--accent);color:var(--on-accent);font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mute)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:12px 0 4px;min-height:44px;cursor:pointer}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:6px 0 0;cursor:pointer}
.lnk.bad{color:var(--bad);font-size:14px;padding:14px 0}
.ico{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--mute);border-radius:8px;font-size:22px;line-height:1;padding:0;cursor:pointer}
.ico:active{background:var(--line)}
.addb{display:block;width:100%;margin-top:8px;padding:12px;border:1px dashed var(--mute);border-radius:2px;background:transparent;color:var(--accent);font:500 14px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

/* поля */
input,textarea,select{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px}
textarea{resize:vertical;min-height:64px}
.o-name{font:600 26px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 0;margin:8px 0 14px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ef .full{grid-column:1/-1}

/* картки замовлень */
.ocard{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-name{font:500 20px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mu{color:var(--mute)}
.wire{--p:0;position:relative;height:14px;margin:12px 0 8px}
.wire::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line)}
.wire i{position:absolute;left:0;top:6px;height:2px;width:calc(var(--p) * 1%);background:var(--gold)}
.wire b{position:absolute;top:2px;width:10px;height:10px;border-radius:0;transform:rotate(45deg);background:var(--gold);left:calc(var(--p) * 1% - var(--p) * .1px)}
@media (prefers-reduced-motion:no-preference){.wire i,.wire b{transition:width .3s,left .3s}}
.emptyst{padding:28px 0;color:var(--mute)}

/* PDA-редизайн, етап 1: системна панель і картки (змінні лише для цих елементів) */
.sysbar,.ocard{--p-card:#1C2018;--p-amb:#D18B27;--p-ink:#D8D4BD;--p-mute:#929785;--p-ok:#69866A;--p-warn:#A84E3D;--p-line:#3a3c2c}
.sysbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;padding:6px 0;border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line);font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--p-mute)}
.sysbar .sb-l{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sysbar .sb-r{flex:none;padding-left:10px;border-left:1px solid var(--p-line);color:var(--p-ink)}
.sb-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--p-ok);box-shadow:0 0 5px rgba(105,134,106,.6)}
.sb-dot.off{background:var(--p-warn);box-shadow:0 0 5px rgba(168,78,61,.6)}
@media (prefers-reduced-motion:no-preference){.sb-dot.on{animation:sbp 2.8s ease-in-out infinite}@keyframes sbp{50%{opacity:.45}}}
.brand.cmp{margin:0 0 12px;padding:8px 12px}
.brand.cmp .bs{height:4px}
.brand.cmp .wm{margin:8px 0 2px;font-size:clamp(20px,6.6vw,40px)}
.brand.cmp .wsub{margin:0 0 8px;font-size:10px}
.ocard{position:relative;background:var(--p-card);border:0;border-left:0;border-radius:0;padding:12px 14px 12px 17px;box-shadow:inset 0 0 0 1px var(--p-line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .15s,box-shadow .15s}
.ocard::before{content:"";position:absolute;left:0;top:0;bottom:12px;width:3px;background:var(--p-amb);box-shadow:0 0 8px rgba(209,139,39,.35)}
.ocard::after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(to top right,transparent calc(50% - .7px),var(--p-amb) 50%,transparent calc(50% + .7px))}
.ocard:active{background:#232819;box-shadow:inset 0 0 0 1px var(--p-amb),inset 0 0 14px rgba(209,139,39,.18)}
.ocard.fin{opacity:.72}.ocard.fin::before{background:var(--p-mute);box-shadow:none}.ocard.fin.ready::before{background:var(--p-ok);box-shadow:0 0 8px rgba(105,134,106,.35)}
.ocard .oc-name{color:var(--p-ink);font-size:18px}
.ocard .thumb{background:#10120E;border-color:var(--p-line);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%)}
.ocard .pill{font-size:10px;padding:2px 6px}
.ocard .pill.ok{color:var(--p-ok)}.ocard .pill.bad{color:var(--p-warn)}.ocard .pill.ac{color:var(--p-amb)}.ocard .pill.mu{color:var(--p-mute)}
.ocard .ccl{color:var(--p-mute)}
.oc-seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:12px 0 7px}
.oc-seg i{height:6px;background:#2a2d20}
.oc-seg i.on{background:var(--p-amb)}
.ocard.fin.ready .oc-seg i.on{background:var(--p-ok)}
.oc-ind{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--p-mute)}
.oc-ind b{font-weight:500;color:var(--p-ink);margin-left:4px}
.oc-ind .oc-pc{margin-left:auto;color:var(--p-amb)}

/* PDA-редизайн, етап 3: екран замовлення як досьє з вкладками */
.ofile,.otabs{--p-card:#1C2018;--p-amb:#D18B27;--p-ink:#D8D4BD;--p-mute:#929785;--p-line:#3a3c2c}
.ofile{position:relative;background:var(--p-card);padding:10px 14px 4px 17px;margin:2px 0 10px;box-shadow:inset 0 0 0 1px var(--p-line);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.ofile::before{content:"";position:absolute;left:0;top:0;bottom:14px;width:3px;background:var(--p-amb);box-shadow:0 0 8px rgba(209,139,39,.35)}
.ofile::after{content:"";position:absolute;right:0;top:0;width:14px;height:14px;background:linear-gradient(to top right,transparent calc(50% - .7px),var(--p-amb) 50%,transparent calc(50% + .7px))}
.of-sys{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--p-line);font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--p-mute);text-transform:uppercase}
.of-id{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofile .o-name{font-size:22px;margin:10px 0 10px}
.of-due{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}
.of-due .fld{margin-bottom:12px}
.of-ind{margin-bottom:12px;min-height:40px;display:flex;align-items:center}
/*otabs*/.otabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 14px}
.otab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;padding:6px 2px;border:1px solid var(--p-line);border-radius:3px;background:#161912;color:var(--p-ink);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.otab b{font:600 11px/1.1 var(--mono);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.otab i{font:500 10px/1 var(--mono);font-style:normal;color:var(--p-mute);min-height:10px}
.otab.on{background:linear-gradient(180deg,#e09a33,#c07f1f);border-color:#D18B27;color:#10120E;box-shadow:0 0 8px rgba(209,139,39,.25)}
.otab.on i{color:#3a2a0e}
.otab:active{filter:brightness(1.12)}
.opane>.sec:first-child{margin-top:6px}
@media (prefers-reduced-motion:no-preference){.opane{animation:opin .18s ease-out}@keyframes opin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* індикатор радіації */
.rad{--rc:#7fa36a;flex:none;display:inline-grid;place-items:center;width:26px;height:26px;color:var(--rc);filter:drop-shadow(0 0 4px var(--rc))}
.rad.y{--rc:#e0c040}.rad.r{--rc:#d0523a}
.rad svg{display:block}
.oc-ind{align-items:center}.oc-ind .rad{margin-left:auto}.oc-ind .rad+.oc-pc{margin-left:6px}
.of-ind .rad{margin-right:8px}
@media (prefers-reduced-motion:no-preference){
.rad{animation:radp 3s ease-in-out infinite}.rad.y{animation-duration:1.8s}.rad.r{animation-duration:1s}
@keyframes radp{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}}

/* PDA-редизайн: склад / інвентар (лише екран «Склад») */
.invh h1{font-size:30px}
.inv{--p-card:#1C2018;--p-amb:#D18B27;--p-ink:#D8D4BD;--p-mute:#929785;--p-line:#3a3c2c;--p-ok:#69866A;--p-warn:#A84E3D}
.inv-tag{font:500 10px/1 var(--mono);letter-spacing:.16em;color:var(--p-amb);margin:0 0 6px}
.inv .sh h2{font-size:17px}
.inv .tw{background:var(--p-card);border:0;border-radius:0;box-shadow:inset 0 0 0 1px var(--p-line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.inv th{font-size:10px;padding:8px 10px 4px;color:var(--p-mute)}
.inv td{padding:7px 10px;border-top:1px solid var(--p-line)}
.inv .nm{font-size:16px;color:var(--p-ink)}
.inv td.q{color:var(--p-ink);font-size:13px}
.inv tbody tr:not(.editing):active td{background:rgba(209,139,39,.1)}
.inv .addb{border-color:var(--p-line);color:var(--p-amb);font-size:13px;padding:10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.inv .rg{gap:8px}
.inv .rt{min-height:84px;gap:4px;padding:10px 12px 10px 14px;background:var(--p-card);border:0;border-top:0;border-radius:0;box-shadow:inset 0 0 0 1px var(--p-line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.inv .rt::before{content:"";position:absolute;left:0;top:0;bottom:12px;width:3px;background:var(--p-amb);box-shadow:0 0 6px rgba(209,139,39,.3)}
.inv .rt::after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(to top right,transparent calc(50% - .7px),var(--p-amb) 50%,transparent calc(50% + .7px))}
.inv .rt:active{background:#232819;box-shadow:inset 0 0 0 1px var(--p-amb),inset 0 0 14px rgba(209,139,39,.18)}
.inv .rt.low::before{background:var(--p-warn);box-shadow:0 0 6px rgba(168,78,61,.45)}
.inv .rt.low::after{background:linear-gradient(to top right,transparent calc(50% - .7px),var(--p-warn) 50%,transparent calc(50% + .7px))}
.inv .rt.ed{clip-path:none;padding:12px}
.inv .rt.ed::before,.inv .rt.ed::after{display:none}
.inv .rl{font-size:10px;letter-spacing:.14em;color:var(--p-mute);overflow-wrap:anywhere}
.inv .rv{font-size:28px;color:var(--p-ink)}
.inv .rv small{font-size:12px;color:var(--p-amb);margin-left:5px}
.inv .rt.low .rv{color:var(--p-warn)}
.inv .seg{gap:3px;margin-top:4px}
.inv .seg i{height:7px;background:#2a2d20}
.inv .seg i.on{background:var(--p-amb)}
.inv .rt.low .seg i.on{background:var(--p-warn)}
.inv .pill.bad{color:var(--p-warn)}
.inv .rt.wide{min-height:96px}
.inv .rt.wide .rl,.inv .rt.wide .rv{padding-right:130px}
.inv .rgauge{position:absolute;right:16px;top:12px;width:120px;height:70px;pointer-events:none}
.inv .rgauge svg{display:block}
.lowbar{--p-warn:#A84E3D;margin:0 0 14px;padding:10px 14px 10px 17px;background:#241812;box-shadow:inset 0 0 0 1px #5a3326;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));position:relative}
.lowbar::before{content:"";position:absolute;left:0;top:0;bottom:12px;width:3px;background:var(--p-warn)}
.lb-h{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.14em;color:#d9775f;margin-bottom:8px}
.lb-i{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #d9775f;font-size:11px}
.lb-r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid #3a2a22;font:500 13px/1.3 var(--mono);color:#D8D4BD}
.lb-r i{font-style:normal;color:#929785;margin-left:6px;font-size:11px}
.inv .ri{position:absolute;top:12px;right:16px;width:44px;height:44px;display:grid;place-items:center;color:#8d8a6c;pointer-events:none}
.inv .ri.silver{color:#b4b8a8}.inv .ri.gold{color:#d9a13a}.inv .ri.solder{color:#a9a592}.inv .ri.ultrasonic{color:#8fb0a8}.inv .ri.blackening{color:#8d8a6c}
.inv .ri img{display:block;width:100%;height:100%;object-fit:contain}
.inv .rt .rl,.inv .rt .rv{padding-right:50px}
.inv .rt.low .ri{color:#7a4a3d}

/* таблиці */
.sec{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.hint{font-size:12px;color:var(--mute)}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:10px 10px 6px;white-space:nowrap}
th.r,td.q{text-align:right}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
td.ck{width:42px;padding-right:0}
td.ck input{width:22px;height:22px;margin:0;padding:0;accent-color:var(--accent)}
td.q{white-space:nowrap;font:400 14px var(--mono);font-variant-numeric:tabular-nums}
td.x{white-space:nowrap;text-align:right;padding-left:0;padding-right:6px}
.nm{font:500 17px/1.2 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
tr.done .nm{text-decoration:line-through;color:var(--mute)}
tr.done .q{color:var(--mute)}
.empty{color:var(--mute);font-size:14px}

/* ресурси */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{position:relative;display:grid;gap:6px;align-content:start;text-align:left;min-width:0;min-height:98px;padding:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:2px;font:inherit;cursor:pointer}
.rt.wide{grid-column:1/-1}
.rt.low{border-top-color:var(--bad)}
.rt.low .rv{color:var(--bad)}
.rl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.rv{font:600 34px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rv small{font:400 13px var(--mono);color:var(--mute);margin-left:6px;letter-spacing:.04em}
.rp{justify-self:start}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:2px}
.seg i{height:9px;background:var(--line)}
.seg i.on{background:var(--accent)}
.rt.low .seg i.on{background:var(--bad)}
.rt.ed{grid-column:1/-1;display:block;cursor:default}
.adj{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* хмара, фото, лайтбокс */
.sync{margin-top:18px;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sync{cursor:pointer}
[hidden]{display:none!important}

function toEur(b){var eur=0,miss=[];Object.keys(b).forEach(function(c){var v=b[c];
  if(c==="€")eur+=v;else if(c==="₴")eur+=v/fxUah();else if(c==="$"){var r=fxGet("usd");if(r)eur+=v/r;else miss.push(c)}else if(c==="lei"){var r2_=fxGet("lei");if(r2_)eur+=v/r2_;else miss.push(c)}else miss.push(c)});
  return {eur:Math.round(eur),miss:miss}}
function earnGrid(e){var t=new Date(),M=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"],q=Math.floor(t.getMonth()/3)+1;
  function c(l,b){var x=toEur(b);return '<div><span>'+l+'</span><b>'+x.eur.toLocaleString("uk-UA")+' €</b><small>≈ '+Math.round(x.eur*fxUah()).toLocaleString("uk-UA")+' ₴'+(x.miss.length?' · без курсу: '+x.miss.join(", "):'')+'</small></div>'}
  return c(M[t.getMonth()],e.r.m)+c(q+" квартал",e.r.q)+c(t.getFullYear()+" рік",e.r.y)}

var CURS=["₴","€","$","lei"];
function cKey(o){return String(o.cname||"").trim().toLowerCase()}
function clientNames(){var seen={},out=[];S.orders.forEach(function(o){var n=String(o.cname||"").trim();if(!o.plan&&n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;out.push(n)}});return out}
function sameClient(o){var k=cKey(o);if(!k)return[];return S.orders.filter(function(x){return x!==o&&!x.plan&&cKey(x)===k})}
function telHref(v){var d=String(v||"").replace(/[^\d+]/g,"");return d?"tel:"+d:""}
function instaUrl(v){v=String(v||"").trim();if(!v)return"";if(/^https?:\/\//i.test(v))return v;v=v.replace(/^@/,"").replace(/^(www\.)?instagram\.com\//i,"").replace(/[\/?#].*$/,"");return v?"https://instagram.com/"+encodeURIComponent(v):""}
function effPrice(o){var f=num(o.fprice);return f!==null?f:num(o.price)}
function matCost(o){var t=0,miss=0;(o.log||[]).forEach(function(e){var r=findIn(S.res,e.rid),p=num(e.p!==undefined&&e.p!==""?e.p:(r?r.price:""));if(p!==null&&p>0)t+=e.amt*p;else miss++});return {t:r2(t),miss:miss,n:(o.log||[]).length}}
function factCost(o){var m=matCost(o),f=num(o.fcost);if(f===null&&!(m.t>0))return null;return r2(m.t+(f||0))}
function effCost(o){var f=factCost(o);return f!==null?f:(num(o.cost)||0)}

/* манометр газу (стрілочний індикатор 0–100%) */
function gaugeSvg(v,min,low){
  var cx=60,cy=60,R=46;
  function P(r,pc){var a=Math.PI*(1-pc/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]}
  function arc(a,b,r){var p1=P(r,a),p2=P(r,b);return 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'A'+r+' '+r+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)}
  var h='<svg viewBox="0 0 120 70" width="120" height="70" aria-hidden="true"><path d="'+arc(0,100,R)+'" fill="none" stroke="#2a2d20" stroke-width="6"/>';
  if(min!==null&&min>0)h+='<path d="'+arc(0,Math.min(100,min),R)+'" fill="none" stroke="#A84E3D" stroke-width="6"/>';
  for(var t=0;t<=100;t+=10){var a=P(R+6,t),b=P(R+(t%50===0?12:9),t);h+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#6f6a50" stroke-width="'+(t%50===0?1.6:1)+'"/>'}
  var e=P(R-8,v===null?0:Math.max(0,Math.min(100,v))),col=v===null?"#6f6a50":(low?"#A84E3D":"#D18B27");
  h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="3.4" fill="'+col+'"/>';
  return h+'</svg>'}

function shrink(file,m,q){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,m/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("toBlob"))},"image/jpeg",q)};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"))};
  im.src=u})}
function fitPhoto(file){
  var tries=[[1280,.8],[1000,.72],[800,.65],[640,.6]],i=0;
  return (function go(){return shrink(file,tries[i][0],tries[i][1]).then(function(b){if(b.size>650000&&i<tries.length-1){i++;return go()}return b})})()}
function blobUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(b)})}

    if(PH[id]){if(im.getAttribute("src")!==PH[id])im.setAttribute("src",PH[id])}else loadPh(id)}}

/* дописування від Claude: зашифрований inbox.enc у репозиторії; ключ вводиться один раз і лишається на телефоні */
var IK_KEY="maisternia-ik",inboxBusy=false;
function ikGet(){try{return localStorage.getItem(IK_KEY)||""}catch(e){return ""}}
function decryptBlob(buf,pass){
  var b=new Uint8Array(buf),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"])
    .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})
    .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct)})
    .then(function(pt){return JSON.parse(new TextDecoder().decode(pt))},function(){throw new Error("badkey")})}
function inboxFind(name){
  var n=String(name||"").toLowerCase();
  for(var j=0;j<S.orders.length;j++){var o=S.orders[j];if(o.id===name||(n&&String(o.name||"").toLowerCase().indexOf(n)>=0))return o}
  return null}
function applyInbox(b){
  var ops=b.ops||[],i=0,done=[],miss=[];
  S.applied=S.applied||[];
  return (function next(){
    if(i>=ops.length){
      S.applied.push(b.id);if(S.applied.length>40)S.applied=S.applied.slice(-40);
      save();render();
      toast(done.length?"Claude оновив: "+done.join(", "):"Нічого застосувати"+(miss.length?" (не знайшов: "+miss.join(", ")+")":""),false);return}
    var op=ops[i++],o;
    if(op.t==="photo"){
      o=inboxFind(op.order);if(!o){miss.push(op.order);return next()}
      var id=uid()+uid()+uid()+uid();
      return FB.putPhoto(cloud.uid,id,op.data).then(function(){PH[id]=op.data;o.photos=o.photos||[];if(op.cover)o.photos.unshift(id);else o.photos.push(id);done.push("фото до «"+(o.name||"замовлення")+"»");return next()})}
    if(op.t==="patch"){
      o=inboxFind(op.order);if(!o){miss.push(op.order);return next()}
      Object.keys(op.set||{}).forEach(function(k){o[k]=op.set[k]});done.push("зміни в «"+(o.name||"замовленні")+"»");return next()}
    if(op.t==="add"){
      var n=op.order||{};n.id=n.id||uid();if(!Array.isArray(n.items))n.items=[];S.orders.unshift(n);done.push("нове замовлення «"+(n.name||"")+"»");return next()}
    return next()})()}
function checkInbox(){
  var k=ikGet();if(!k||!cloud.uid||!cloud.ready||inboxBusy)return;
  inboxBusy=true;
  fetch("inbox.enc?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("none");return r.arrayBuffer()})
    .then(function(buf){return decryptBlob(buf,k)})
    .then(function(b){if(!b||!b.id||(S.applied||[]).indexOf(b.id)>=0)return;return applyInbox(b)})
    .catch(function(e){if(e&&e.message==="badkey")toast("Ключ від Claude не підходить. Введіть новий у «Копія даних».",false)})
    .then(function(){inboxBusy=false})}

/* одноразовий імпорт зі старої версії (зашифрований файл migration.enc) */
var IMPORT_ON=false;
function impRun(){
  var p=((document.getElementById("imp-pass")||{}).value||"").trim(),msg=document.getElementById("imp-msg");
  function say(t){if(msg)msg.textContent=t}
  if(!cloud.uid){say("Спочатку увійдіть в акаунт.");return}
  if(!p){say("Введіть пароль імпорту.");return}
  say("Завантажую файл…");
  fetch("migration.enc",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("nofile");return r.arrayBuffer()}).then(function(buf){
    var b=new Uint8Array(buf),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
    say("Розшифровую…");
    return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"])
      .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})
      .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct)})
      .catch(function(){throw new Error("badpass")})
  }).then(function(pt){
    var o=JSON.parse(new TextDecoder().decode(pt)),ids=Object.keys(o.photos||{}),i=0;
    (function next(){
      if(i>=ids.length){
        S=o.s;normS();S.updated=Date.now();saveQuiet();pushNow();cur=null;bkOpen=false;render();toast("Імпорт завершено: замовлень "+S.orders.length+", фото "+ids.length,false);return}
      say("Фото "+(i+1)+" з "+ids.length+"…");
      var id=ids[i];
      FB.putPhoto(cloud.uid,id,o.photos[id]).then(function(){PH[id]=o.photos[id];i++;next()},function(){say("Не вдалося записати фото. Перевірте інтернет і повторіть.")})
    })()
  }).catch(function(e){say(e&&e.message==="badpass"?"Невірний пароль імпорту.":"Не вдалося імпортувати. Перевірте інтернет і повторіть.")})}

/* майстри: облік золота й срібла. Видано, повернуто, на руках, після розрахунку втрата */
var ICON_M='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
var METALS=[{k:"silver",n:"Срібло"},{k:"gold",n:"Золото"}];
function r2(x){return Math.round(x*100)/100}
function metalName(k){for(var i=0;i<METALS.length;i++)if(METALS[i].k===k)return METALS[i].n;return k}
function normMasters(){
  if(!Array.isArray(S.masters))S.masters=[];
  S.masters.forEach(function(m){
    if(!Array.isArray(m.moves)){
      m.moves=[];var v=num(m.silver);
      if(v!==null&&v>0)m.moves.push({id:uid(),d:m.d||today(),metal:"silver",type:"issue",amt:v,note:""})
    }
  })}
function mStats(m,metal){
  var iss=0,ret=0;
  (m.moves||[]).forEach(function(e){if(e.metal!==metal)return;if(e.type==="issue")iss+=e.amt;else ret+=e.amt});
  iss=r2(iss);ret=r2(ret);
  var hand=r2(iss-ret);
  return {iss:iss,ret:ret,hand:hand,loss:hand,pct:iss>0?r2(hand/iss*100):null}}
function handTotals(){
  var t={silver:0,gold:0};
  S.masters.forEach(function(m){if(m.settled)return;METALS.forEach(function(x){t[x.k]+=mStats(m,x.k).hand})});
  t.silver=r2(t.silver);t.gold=r2(t.gold);return t}
function lossCell(s){
  if(!s.iss)return '<td class="q">—</td>';
  if(s.loss>0)return '<td class="q"><span class="lv bad">'+s.loss+' г</span><div class="nt">'+s.pct+'%</div></td>';
  if(s.loss<0)return '<td class="q"><span class="lv warn">+'+(-s.loss)+' г</span><div class="nt">надлишок</div></td>';
  return '<td class="q"><span class="lv ok">0 г</span><div class="nt">0%</div></td>'}

function masterCard(m){
  var blocks=METALS.map(function(x){
    var s=mStats(m,x.k);if(!s.iss&&!s.ret)return"";
    var big=m.settled?(s.loss>0?s.loss:(s.loss<0?"+"+(-s.loss):0)):s.hand;
    var lbl=m.settled?(s.loss>=0?"г втрата":"г надлишок"):"г на руках";
    var note=m.settled?(s.pct!==null?s.pct+"% від виданого":""):"видано "+s.iss+" · повернуто "+s.ret;
    return '<div class="mm"><span class="rl">'+x.n+'</span><span class="mq">'+big+'<small>'+lbl+'</small></span><span class="mnote">'+note+'</span></div>'}).join("");
  return '<button class="mcard'+(m.settled?" set":"")+'" data-act="m-open" data-id="'+m.id+'"><div class="oc-top"><span class="oc-name">'+esc(m.name||"Без імені")+'</span>'+(m.settled?'<span class="pill ok">розраховано</span>':"")+'</div>'
   +(m.task?'<div class="mtask">'+esc(m.task)+'</div>':"")
   +(blocks?'<div class="mgrid">'+blocks+'</div>':'<div class="mtask mu">Металу ще не видавали</div>')+'</button>'}

function moveForm(){

var DEFAULTS={silver:80,cast:110,lossOwn:5,lossClient:10,solderPrice:200,solderPer10:1,castSolder:0.5,
  fluxPer10:10,fluxPrice:500,fluxGrams:500,consum:50,dayRate:5600,dayHours:8,masterRate:50,rent:0,
  eur:50,markup:65,round:100,lvlS:35,lvlM:40,lvlA:45,lvlH:50};
function num(v){var n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function autoRound(x){var st=x<2000?100:x<10000?500:x<30000?1000:2500;return Math.ceil(x/st-1e-9)*st}
function roundUp(x,step){step=step>0?step:1;return Math.ceil(x/step-1e-9)*step}
function compute(s,o){
  var handW=num(o.handW),castW=num(o.castW),w=handW+castW,hours=num(o.hours),cx=num(o.complexity)||1;
  var lossOwn=num(s.lossOwn)/100,lossClient=num(s.lossClient)/100;
  var client=o.metal==="client";
  var r={};
  r.weight=w;
  r.handCost=client?0:handW*(1+lossOwn)*num(s.silver);
  r.handWeightUsed=client?handW*(1+lossClient):handW*(1+lossOwn);
  r.castCost=castW*(1+lossOwn)*num(s.cast);
  r.solderG=handW*num(s.solderPer10)/10+castW*num(s.solderPer10)/10*num(s.castSolder);
  r.solderCost=r.solderG*num(s.solderPrice);
  r.fluxG=w*num(s.fluxPer10)/10;
  r.fluxCost=num(s.fluxGrams)>0?r.fluxG*num(s.fluxPrice)/num(s.fluxGrams):0;
  r.consCost=w*num(s.consum)/10;
  r.hourRate=num(s.dayHours)>0?num(s.dayRate)/num(s.dayHours):0;
  if(o.who==="master"){r.labor=(w*num(s.masterRate)*cx)+num(o.masterExtra)}
  else{r.labor=hours*r.hourRate*cx}
  r.rent=num(s.dayHours)>0?hours/num(s.dayHours)*num(s.rent):0;
  r.icon=num(o.icon);r.pack=num(o.pack);r.wood=num(o.wood);r.stones=num(o.stones);r.gilding=num(o.gilding);r.goldEl=num(o.goldEl);r.chains=num(o.chains);r.laser=num(o.laser);r.other=num(o.other);
  r.extras=r.icon+r.pack+r.wood+r.stones+r.gilding+r.goldEl+r.chains+r.laser+r.other;
  r.floor=r.handCost+r.castCost+r.solderCost+r.fluxCost+r.consCost+r.labor+r.rent+r.extras;
  r.levelMargin=null;
  r.rec=r.floor>0?autoRound(r.floor):0;
  var p=num(o.price);
  r.price=p>0?p:r.rec;
  r.customPrice=p>0;
  r.margin=r.price-r.floor;
  r.marginPct=r.price>0?r.margin/r.price:0;
  r.markupPct=r.floor>0?r.margin/r.floor:0;
  r.discount=r.rec-r.price;
  r.matCosts=r.floor-r.labor;
  r.earnTotal=(o.who==='master')?r.margin:(r.margin+r.labor);
  var meMode=o.who!=="master";
  r.belowRate=false;
  if(r.floor<=0)r.status="none";
  else if(meMode){
    if(r.price<r.floor-r.labor-0.5)r.status="bad";
    else if(r.price<r.floor-0.5){r.status="warn";r.belowRate=true}
    else r.status=r.marginPct<0.15?"warn":"ok";
  }else r.status=r.price<r.floor-0.5?"bad":(r.marginPct<0.15?"warn":"ok");
  // заробіток за годину (тільки коли працюєш сам і є години)
  var nonLabor=r.floor-r.labor-r.rent;
  r.earnHour=(o.who!=="master"&&hours>0)?(r.price-nonLabor-r.rent)/hours:null;
  // звіт по металу клієнта
  if(client){
    var given=num(o.clientGiven);
    r.client={need:handW*(1+lossClient),loss:handW*lossClient,given:given,rest:given-handW*(1+lossClient)};
  }
  // бюджет
  var b=num(o.budget);
  if(b>0){r.budget={value:b,gap:b-r.floor,pct:b>0?(b-r.floor)/b:0,vsRec:r.rec-b}}
  return r;
}

  bk.push(["Ікона",r.icon,0,""]);bk.push(["Дерево",r.wood,0,""]);bk.push(["Пакування",r.pack,0,""]);bk.push(["Каміння",r.stones,0,""]);bk.push(["Позолота",r.gilding,0,""]);bk.push(["Золоті елементи",r.goldEl,0,""]);
  bk.push(["Ланцюжок, фурнітура",r.chains,0,""]);bk.push(["Лазерне гравіювання",r.laser,0,""]);bk.push(["Інше",r.other,0,""]);
  if(order.who==="master"){bk.push(["Разом собівартість",r.floor,1,""])}
  else{
    bk.push(["Разом витрати (без заробітку компанії)",r.matCosts,1,""]);
    var cx=num(order.complexity)||1;
    bk.push(["Заробіток компанії мінімальний",r.labor,0,num(order.hours)+" год × "+fmt(r.hourRate)+(cx!==1?" × складність "+cx:""),"L"]);
    bk.push(["Витрати + заробіток компанії = мінімальна ціна",r.floor,1,""]);

  var pc=$("bar-price-c");pc.className="c "+(r.status==="none"?"":r.status);

  // повідомлення

  else if(r.belowRate){cls+=" warn";txt="Витрати покриті, але заробіток компанії нижчий за ціль: "+(r.earnHour!==null?fmt(r.earnHour)+" за годину":"")+" проти "+fmt(r.hourRate*(num(order.complexity)||1))+".";}
  else if(r.status==="warn"){cls+=" warn";txt="Ціна вище мінімуму, але запас малий: "+fmt(r.margin)+" ("+pct(r.marginPct)+" від ціни).";}
  else{cls+=" ok";txt=(r.customPrice?"Ціна тримається: ":"Рекомендована ціна: ")+(order.who==="master"?"запас ":"понад ціль ")+fmt(r.margin)+".";}
  if(order.gift&&r.status!=="none"&&r.discount>0)txt+=" Подарунок коштує тобі "+fmt(r.discount)+" від рекомендованої.";

  $("row-be").hidden=order.who==="master";$("r-be").textContent=fmt(r.matCosts);$("lbl-margin").textContent=order.who==="master"?"Заробіток понад собівартість":"Заробіток компанії понад ціль";
  $("r-margin").textContent=fmt(r.margin);$("r-mp").textContent=pct(r.marginPct);$("r-mc").textContent=pct(r.markupPct);

    if(c.given>0){rows.push(["Клієнт приніс",fmtG(c.given),0,""]);rows.push([c.rest>=0?"Повертаємо клієнту":"Не вистачає",fmtG(Math.abs(c.rest)),1,""])}

function renderHistory(){

    var d=document.createElement("div");d.className="hrow"+(it.photoId?"":" nophoto");

    d.querySelector(".n").textContent=(it.order.name||"Без назви")+(it.order.gift?" · подарунок":"");

function summaryText(){

  buildBreakdown(r).forEach(function(x){if(x[1]===0&&!x[3])return;L.push((x[2]?"":"- ")+x[0]+": "+(typeof x[1]==="number"?fmt(x[1]):x[1])+(x[3]&&!x[2]?" ("+x[3]+")":""))});

function copyText(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");kt("Скопійовано")}catch(e){kt("Не вдалося скопіювати")}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){kt("Скопійовано")},fb)}else fb()}

function wrapFit(ctx,text,maxW,size,weight){var sz=size;ctx.font=weight+" "+sz+"px 'Arial Narrow',Arial,sans-serif";while(ctx.measureText(text).width>maxW&&sz>26){sz-=2;ctx.font=weight+" "+sz+"px 'Arial Narrow',Arial,sans-serif"}return sz}
function makeCard(){
  var r=update.last;if(!r||r.status==="none"){kt("Спочатку введи дані виробу");return}
  var rows=buildBreakdown(r).filter(function(x){return !x[2]&&x[4]!=="L"&&!(x[1]===0&&!x[3])});
  function draw(img){
    var W=1080,P=60,IW=W-2*P,dw=0,dh=0;
    if(img){var sc=Math.min(IW/img.width,1000/img.height);dw=img.width*sc;dh=img.height*sc}
    var H=P+40+90+(img?dh+40:0)+60+rows.length*60+20+6*64+110;
    var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    x.fillStyle="#12130e";x.fillRect(0,0,W,H);
    var y=P;
    x.fillStyle="#e0932d";x.font="600 26px 'Arial Narrow',Arial,sans-serif";x.textBaseline="alphabetic";x.fillText("САРАНЧУК · ЮВЕЛІРНА МАЙСТЕРНЯ",P,y+26);
    var dt=new Date().toLocaleDateString("uk-UA");x.fillStyle="#8f8c77";x.textAlign="right";x.fillText(dt,W-P,y+26);x.textAlign="left";
    y+=40+70;
    x.fillStyle="#dcd8c4";var nm=order.name||"Виріб";var sz=wrapFit(x,nm,IW,56,"700");x.fillText(nm,P,y);
    y+=20;
    if(img){x.fillStyle="#1b1d15";x.fillRect(P,y,IW,dh);x.drawImage(img,P+(IW-dw)/2,y,dw,dh);y+=dh+40}
    x.fillStyle="#8f8c77";x.font="400 26px 'Arial Narrow',Arial,sans-serif";
    var meta="Вага "+fmtG(r.weight)+" · філігрань "+fmtG(num(order.handW))+" · литво "+fmtG(num(order.castW))+" · "+(order.who==="master"?"робить майстер":"роблю я");
    x.fillText(meta,P,y+10);y+=60;
    x.strokeStyle="#3a3c2c";x.lineWidth=2;
    rows.forEach(function(rw){
      x.fillStyle="#dcd8c4";x.font="400 32px 'Arial Narrow',Arial,sans-serif";x.fillText(rw[0],P,y+34);
      x.textAlign="right";x.font="400 32px 'Courier New',monospace";x.fillText(typeof rw[1]==="number"?fmt(rw[1]):rw[1],W-P,y+34);x.textAlign="left";
      y+=60;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke()});
    y+=20;
    function line(label,val,col,bold){x.fillStyle=col;x.font=(bold?"700":"400")+" 34px 'Arial Narrow',Arial,sans-serif";x.fillText(label,P,y+36);x.textAlign="right";x.font=(bold?"700":"400")+" 34px 'Courier New',monospace";x.fillText(val,W-P,y+36);x.textAlign="left";y+=64}
    if(order.who==="master")line("Собівартість (з майстром)",fmt(r.floor),"#e0932d",true);
    else{line("Витрати",fmt(r.matCosts),"#e0932d",true);line("Заробіток компанії мінімальний",fmt(r.labor),"#dcd8c4",false)}
    line("Рекомендована ціна",fmt(r.rec),"#dcd8c4",false);
    line("Ціна для клієнта",fmt(r.price)+" "+fmtEur(r.price),"#dcd8c4",true);
    line("Загальний заробіток компанії",fmt(r.earnTotal),r.earnTotal<0?"#d4553b":"#93b34a",true);
    line(order.who==="master"?"Запас понад собівартість":"Понад ціль",fmt(r.margin)+" · "+pct(r.marginPct),r.status==="bad"?"#d4553b":"#93b34a",false);
    x.fillStyle="#8f8c77";x.font="400 22px 'Arial Narrow',Arial,sans-serif";x.fillText("Внутрішня картка виробу · для документації",P,H-P+10);
    $("ov-img").src=c.toDataURL("image/png");$("ov").hidden=false;$("ov").scrollTop=0}
  getPh(order.photo).then(function(u){if(u){var im=new Image();im.onload=function(){draw(im)};im.onerror=function(){draw(null)};im.src=u}else draw(null)});
}

function mount(){
  var host=document.getElementById("kc-host");if(!host)return;
  if(!host.attachShadow){host.textContent="Цей браузер не підтримує калькулятор.";return}
  root=host.attachShadow({mode:"open"});
  root.innerHTML='<style>'+KCSS+KCSS_X+'</style>'+KHTML;
  load();bindInputs();update();renderHistory();showPhoto();
  $("btn-save").addEventListener("click",function(){
    var r=update.last;if(!r||r.status==="none"){kt("Спочатку введи дані виробу");return}
    var id=Math.random().toString(36).slice(2,9);
    var it={id:id,ts:Date.now(),floor:r.floor,price:r.price,photoId:order.photo||"",order:JSON.parse(JSON.stringify(order))};
    hlist.unshift(it);
    var drop=hlist.slice(60);hlist=hlist.slice(0,60);
    persist();drop.forEach(function(x){phRelease(x.photoId)});
    renderHistory();kt("Розрахунок збережено")});
  $("btn-card").addEventListener("click",makeCard);
  $("btn-photo").addEventListener("click",function(){$("in-photo").click()});
  $("in-photo").addEventListener("change",function(){
    var f=this.files&&this.files[0];this.value="";if(!f)return;
    if(!assetsCap){kt("Фото зберігаються в хмарі: увійдіть у застосунок");return}
    kt("Завантажую фото…");
    fitPhoto(f).then(function(b){return assetsCap.upload(b)}).then(function(r){
      var old=order.photo;order.photo=r.id;persist();phRelease(old);showPhoto();kt("Фото додано")},
      function(){kt("Не вдалося завантажити фото")})});
  $("btn-photo-del").addEventListener("click",function(){var old=order.photo;order.photo="";persist();phRelease(old);showPhoto()});
  $("ov-close").addEventListener("click",function(){$("ov").hidden=true});
  $("ov-copy").addEventListener("click",function(){copyText(summaryText())});
  $("btn-copy").addEventListener("click",function(){copyText(summaryText())});
  $("btn-clear").addEventListener("click",function(){var old=order.photo;order=blankOrder();persist();phRelease(old);syncInputs();update();showPhoto();window.scrollTo({top:0,behavior:"smooth"})});
  $("btn-reset").addEventListener("click",function(){settings=Object.assign({},DEFAULTS);persist();syncInputs();update();kt("Повернуто значення за замовчуванням")});
}

return {html:html,mount:mount,compute:compute,DEFAULTS:DEFAULTS};
